name: Bug report
description: Something in a skill or script does not work as described
labels: [bug]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options: [bvt-multi-language, bvt-save-token, bvt-crypto-architecture]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you asked Claude or which script you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Claude Code 2.x on Windows 11 / Claude app / other agent"
  - type: markdown
    attributes:
      value: "Please remove API keys, wallet addresses and personal data before posting. Security problems go to support@bitvault.club instead."
