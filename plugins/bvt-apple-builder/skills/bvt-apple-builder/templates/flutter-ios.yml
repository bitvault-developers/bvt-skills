# Save as .github/workflows/flutter-ios.yml
# Flutter app -> iPhone/iPad build -> TestFlight on a GitHub Mac runner (instead of Codemagic).
# Needs in the ios/ folder: Gemfile and fastlane/Fastfile (templates/fastlane/Fastfile.existing-project),
# fastlane/Matchfile and fastlane/Appfile.
# First run: lane "certs". After that: lane "beta".
name: flutter-ios

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "beta = build and send to TestFlight. certs = signing setup."
        type: choice
        options:
          - beta
          - certs
        default: beta
  push:
    tags: ["ios-v*"]

concurrency:
  group: flutter-ios
  cancel-in-progress: false

jobs:
  ios:
    # Image names and installed Xcode versions: https://github.com/actions/runner-images
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Pick Xcode (pinned on purpose)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: ios

      - name: Get Flutter packages
        run: flutter pub get

      - name: Prepare the iOS build (no signing yet)
        if: (inputs.lane || 'beta') == 'beta'
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Run fastlane
        working-directory: ios
        run: bundle exec fastlane ios ${{ inputs.lane || 'beta' }}
        env:
          XC_PROJECT: Runner.xcodeproj
          XC_WORKSPACE: Runner.xcworkspace
          XC_SCHEME: Runner
          BUNDLE_ID: REPLACE_BUNDLE_ID
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Keep the full Xcode log when the build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-build-log
          path: ~/Library/Logs/gym
          if-no-files-found: ignore
