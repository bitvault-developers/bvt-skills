# Save as .github/workflows/ios-native.yml
# Native SwiftUI app: XcodeGen makes the project, fastlane signs, builds and uploads.
# Start it by hand: GitHub > Actions > ios-native > Run workflow.
#   lane "certs" = first-time signing setup (run once, and again after the certificate expires)
#   lane "beta"  = build and send to TestFlight
# A tag like ios-v1.0.0 also starts lane "beta".
name: ios-native

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "beta = build and send to TestFlight. certs = signing setup."
        type: choice
        options:
          - beta
          - certs
        default: beta
  push:
    tags: ["ios-v*"]

concurrency:
  group: ios-native
  cancel-in-progress: false

jobs:
  ios:
    # Image names and installed Xcode versions: https://github.com/actions/runner-images
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Pick Xcode (pinned on purpose; raise it by hand after reading the runner README)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', '**/Package.resolved') }}

      - name: Make the Xcode project from project.yml
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Run fastlane
        run: bundle exec fastlane ios ${{ inputs.lane || 'beta' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Keep the full Xcode log when the build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-build-log
          path: ~/Library/Logs/gym
          if-no-files-found: ignore

      - name: Keep the app file
        if: success() && (inputs.lane || 'beta') == 'beta'
        uses: actions/upload-artifact@v7
        with:
          name: ipa
          path: "*.ipa"
          if-no-files-found: ignore
