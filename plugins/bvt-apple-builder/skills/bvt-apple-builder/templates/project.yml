# XcodeGen project file. Save as project.yml in the repo root.
# Replace: App (name), REPLACE_BUNDLE_ID, REPLACE_TEAM_ID, REPLACE_APP_NAME, REPLACE_NO_OR_YES.
name: App

options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # "5.0" is the easy start. Move to "6.0" when the code is ready for strict concurrency checks.
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: REPLACE_TEAM_ID

targets:
  App:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    # makes a shared scheme named "App", which fastlane needs
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: REPLACE_BUNDLE_ID
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: REPLACE_APP_NAME
        # Export compliance answer. Decide with references/compliance.md, then write NO or YES.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: REPLACE_NO_OR_YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # 1 = iPhone, 2 = iPad
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Resources/App.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          # fastlane match names App Store profiles like this
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore REPLACE_BUNDLE_ID"
