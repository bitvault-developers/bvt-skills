# Save as .github/workflows/rn-bare-ios.yml
# React Native app WITHOUT Expo -> iPhone/iPad build -> TestFlight.
# If the app can use Expo (prebuild + EAS), prefer that route: it needs none of this.
# Needs in the ios/ folder: Gemfile (with fastlane and cocoapods) and fastlane/Fastfile
# (templates/fastlane/Fastfile.existing-project), fastlane/Matchfile, fastlane/Appfile.
# Replace REPLACE_APP with the Xcode project name, REPLACE_BUNDLE_ID with the bundle ID.
name: rn-bare-ios

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "beta = build and send to TestFlight. certs = signing setup."
        type: choice
        options:
          - beta
          - certs
        default: beta
  push:
    tags: ["ios-v*"]

concurrency:
  group: rn-bare-ios
  cancel-in-progress: false

jobs:
  ios:
    # Image names and installed Xcode versions: https://github.com/actions/runner-images
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - name: Pick Xcode (pinned on purpose)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install app packages
        run: npm ci

      - name: Set up Ruby, fastlane and CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: ios

      - name: Cache pods
        uses: actions/cache@v5
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}

      - name: Install pods
        if: (inputs.lane || 'beta') == 'beta'
        working-directory: ios
        run: bundle exec pod install

      - name: Run fastlane
        working-directory: ios
        run: bundle exec fastlane ios ${{ inputs.lane || 'beta' }}
        env:
          XC_PROJECT: REPLACE_APP.xcodeproj
          XC_WORKSPACE: REPLACE_APP.xcworkspace
          XC_SCHEME: REPLACE_APP
          BUNDLE_ID: REPLACE_BUNDLE_ID
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Keep the full Xcode log when the build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-build-log
          path: ~/Library/Logs/gym
          if-no-files-found: ignore
