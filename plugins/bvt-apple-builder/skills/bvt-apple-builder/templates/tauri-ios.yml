# Save as .github/workflows/tauri-ios.yml
# Tauri v2 app -> iPhone/iPad build -> TestFlight.
# Start it by hand: GitHub > Actions > tauri-ios > Run workflow. A tag like ios-v1.0.0 also starts it.
#
# The iOS project (src-tauri/gen/apple) can only be created on macOS.
#   First run: the workflow creates it and saves it as the artifact "tauri-ios-project".
#   Download that artifact, unzip it into src-tauri/gen/apple, commit it.
#   Later runs use the committed folder, so edits to its entitlements and settings are kept.
name: tauri-ios

on:
  workflow_dispatch:
  push:
    tags: ["ios-v*"]

concurrency:
  group: tauri-ios
  cancel-in-progress: false

jobs:
  ios:
    # Image names and installed Xcode versions: https://github.com/actions/runner-images
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_API_KEY: ${{ secrets.ASC_KEY_ID }}
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
      # Manual signing instead of automatic: remove the three APPLE_API_* uses for signing and set
      # IOS_CERTIFICATE, IOS_CERTIFICATE_PASSWORD, IOS_MOBILE_PROVISION (all base64). See references/routes.md.
    steps:
      - uses: actions/checkout@v6

      - name: Pick Xcode (pinned on purpose; raise it by hand after reading the runner README)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust with the iPhone target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install tools Tauri needs for iOS
        run: brew install xcodegen cocoapods || true

      - name: Install app packages
        run: npm ci

      - name: Put the App Store Connect key on the runner (temp folder, never uploaded)
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${APPLE_API_KEY}.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "API_PRIVATE_KEYS_DIR=$RUNNER_TEMP/keys" >> "$GITHUB_ENV"

      - name: Create the iOS project if it is not in the repo yet
        id: init
        run: |
          if [ -d src-tauri/gen/apple ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            npm run tauri ios init -- --ci
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the new iOS project so it can be committed
        if: steps.init.outputs.created == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tauri-ios-project
          path: |
            src-tauri/gen/apple
            !src-tauri/gen/apple/build
            !src-tauri/gen/apple/Externals

      - name: Build the app file (.ipa)
        run: npm run tauri ios build -- --ci --export-method app-store-connect --build-number ${{ github.run_number }}

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          IPA=$(ls src-tauri/gen/apple/build/arm64/*.ipa | head -n 1)
          BUNDLE_ID=$(node -p "require('./src-tauri/tauri.conf.json').identifier")
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version || require('./package.json').version")
          xcrun altool --upload-package "$IPA" -t ios \
            --apple-id "$ASC_APP_ID" \
            --bundle-id "$BUNDLE_ID" \
            --bundle-version "${{ github.run_number }}" \
            --bundle-short-version-string "$VERSION" \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER" 2>&1 | tee "$RUNNER_TEMP/upload.log"
          # altool has reported success on failed uploads, so read its output too
          if grep -Eq "ERROR ITMS|\*\*\* Error|Failed to upload|Unable to upload" "$RUNNER_TEMP/upload.log"; then
            echo "The upload log contains an error."
            exit 1
          fi

      - name: Keep the app file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ipa
          path: src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: ignore
