# Save as .github/workflows/tauri-macos.yml
# Tauri v2 app -> Mac desktop app (.dmg), signed with Developer ID, notarized and stapled.
# Start it by hand: GitHub > Actions > tauri-macos > Run workflow. A tag like mac-v1.0.0 also starts it.
# The .dmg appears under "Artifacts" on the finished run.
name: tauri-macos

on:
  workflow_dispatch:
  push:
    tags: ["mac-v*"]

concurrency:
  group: tauri-macos
  cancel-in-progress: false

jobs:
  macos:
    # Image names: https://github.com/actions/runner-images
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust for Apple-silicon and Intel Macs
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install app packages
        run: npm ci

      - name: Put the App Store Connect key on the runner (temp folder, never uploaded)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signing (Developer ID Application certificate)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # notarization (App Store Connect API key)
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.ASC_KEY_ID }}
        with:
          args: --target universal-apple-darwin

      - name: Check that macOS accepts the app
        run: |
          APP=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -n 1)
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n 1)
          spctl -a -vv "$APP"
          xcrun stapler validate "$APP"
          echo "dmg: $DMG"

      - name: Keep the .dmg
        uses: actions/upload-artifact@v7
        with:
          name: mac-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
